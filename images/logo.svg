<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110">
  <defs>
    <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#0284c7"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="sunset-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="sand-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <filter id="drop-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0c4a6e" flood-opacity="0.3"/>
    </filter>
    <filter id="ocean-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="wave-clip">
      <path d="M0,60 Q20,50 40,60 T80,60 T120,60 T160,60 T200,60 T240,60 T280,60 T320,60 T360,60 V110 H0Z"/>
    </clipPath>
  </defs>

  <!-- Wave decoration at bottom -->
  <g opacity="0.08">
    <path d="M0,85 Q15,78 30,85 T60,85 T90,85 T120,85 T150,85 T180,85 T210,85 T240,85 T270,85 T300,85 T330,85 T360,85 T380,85" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M0,92 Q15,85 30,92 T60,92 T90,92 T120,92 T150,92 T180,92 T210,92 T240,92 T270,92 T300,92 T330,92 T360,92 T380,92" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <path d="M0,99 Q15,92 30,99 T60,99 T90,99 T120,99 T150,99 T180,99 T210,99 T240,99 T270,99 T300,99 T330,99 T360,99 T380,99" fill="none" stroke="#0ea5e9" stroke-width="1"/>
  </g>

  <!-- Island / palm tree icon -->
  <g transform="translate(12, 8)" filter="url(#ocean-glow)">
    <!-- Island base -->
    <ellipse cx="30" cy="70" rx="28" ry="8" fill="url(#sand-grad)" opacity="0.7"/>
    <!-- Palm trunk -->
    <path d="M30,70 Q28,45 35,20" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <!-- Palm leaves -->
    <path d="M35,20 Q50,15 55,25" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M35,20 Q20,10 10,18" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M35,20 Q45,8 52,12" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M35,20 Q25,5 15,10" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M35,20 Q38,6 42,8" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sunset circle behind -->
    <circle cx="45" cy="35" r="12" fill="url(#sunset-grad)" opacity="0.3"/>
    <!-- Water waves below island -->
    <path d="M2,78 Q10,74 18,78 T34,78 T50,78 T58,78" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
    <path d="M5,82 Q12,78 20,82 T36,82 T52,82 T56,82" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <!-- Beer mug on island -->
    <rect x="40" y="55" width="12" height="14" rx="2" fill="#f59e0b" opacity="0.7"/>
    <rect x="52" y="58" width="4" height="8" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="46" cy="54" rx="7" ry="3" fill="#fef3c7" opacity="0.6"/>
  </g>

  <!-- Vertical separator -->
  <line x1="80" y1="18" x2="80" y2="82" stroke="url(#ocean-grad)" stroke-width="1" opacity="0.3"/>

  <!-- Text: BOTECO -->
  <text x="94" y="42" font-family="'Libre Baskerville', Georgia, serif" font-size="32" font-weight="700" fill="#0c4a6e" letter-spacing="3" filter="url(#drop-shadow)">BOTECO</text>

  <!-- Text: DA ILHA -->
  <text x="94" y="68" font-family="'Libre Baskerville', Georgia, serif" font-size="22" fill="url(#ocean-grad)" letter-spacing="6" font-weight="400">DA ILHA</text>

  <!-- Decorative line -->
  <line x1="94" y1="76" x2="245" y2="76" stroke="url(#ocean-grad)" stroke-width="1" opacity="0.4"/>
  <circle cx="94" cy="76" r="1.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="245" cy="76" r="1.5" fill="#0ea5e9" opacity="0.5"/>

  <!-- Tagline -->
  <text x="94" y="90" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" letter-spacing="2" font-style="italic">BEIRA-MAR NORTE | DESDE 2002</text>

  <!-- Decorative elements on the right -->
  <g opacity="0.15">
    <!-- Seagull silhouettes -->
    <path d="M290,20 Q295,15 300,20" fill="none" stroke="#0c4a6e" stroke-width="1.5"/>
    <path d="M310,15 Q313,11 316,15" fill="none" stroke="#0c4a6e" stroke-width="1"/>
    <path d="M325,22 Q328,18 331,22" fill="none" stroke="#0c4a6e" stroke-width="1"/>
    <!-- More waves -->
    <path d="M280,50 Q290,44 300,50 T320,50 T340,50 T360,50" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <path d="M280,58 Q290,52 300,58 T320,58 T340,58 T360,58" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <path d="M280,66 Q290,60 300,66 T320,66 T340,66 T360,66" fill="none" stroke="#7dd3fc" stroke-width="0.8"/>
    <!-- Sun rays -->
    <circle cx="350" cy="30" r="8" fill="#f97316" opacity="0.3"/>
    <line x1="350" y1="18" x2="350" y2="14" stroke="#f97316" stroke-width="1"/>
    <line x1="358" y1="22" x2="362" y2="18" stroke="#f97316" stroke-width="1"/>
    <line x1="362" y1="30" x2="366" y2="30" stroke="#f97316" stroke-width="1"/>
    <line x1="358" y1="38" x2="362" y2="42" stroke="#f97316" stroke-width="1"/>
    <line x1="342" y1="22" x2="338" y2="18" stroke="#f97316" stroke-width="1"/>
    <line x1="338" y1="30" x2="334" y2="30" stroke="#f97316" stroke-width="1"/>
    <line x1="342" y1="38" x2="338" y2="42" stroke="#f97316" stroke-width="1"/>
  </g>

  <!-- Corner ornaments -->
  <path d="M90,14 L94,14 L94,10" fill="none" stroke="#0ea5e9" stroke-width="0.7" opacity="0.4"/>
  <path d="M249,76 L253,76 L253,80" fill="none" stroke="#0ea5e9" stroke-width="0.7" opacity="0.4"/>
</svg>
